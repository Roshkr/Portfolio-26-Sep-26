  <path d="M84,105 Q78,118 84,132" fill="none" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M156,105 Q162,118 156,132" fill="none" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Text ring: H.D. JAIN COLLEGE ARA -->
