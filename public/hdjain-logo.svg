      <stop offset="0%" stop-color="#701a28"/>
      <stop offset="100%" stop-color="#400912"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#c59b27"/>
    </linearGradient>
  </defs>
  <circle cx="120" cy="120" r="114" fill="url(#jainBg)" stroke="#d4af37" stroke-width="4"/>
  <circle cx="120" cy="120" r="102" fill="none" stroke="#d4af37" stroke-dasharray="4,2" stroke-width="2"/>
  <circle cx="120" cy="120" r="82" fill="#50121d" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Emblem Center -->
  <!-- Open Book of Knowledge -->
  <path d="M120,126 C110,118 90,118 74,122 L74,148 C90,144 110,144 120,152 C130,144 150,144 166,148 L166,122 C150,118 130,118 120,126 Z" fill="#ffffff" stroke="#d4af37" stroke-width="2.5"/>
  <line x1="120" y1="126" x2="120" y2="152" stroke="#d4af37" stroke-width="2.5"/>
  
  <!-- Torch of Wisdom -->
  <path d="M120,72 Q126,85 120,96 Q114,85 120,72 Z" fill="url(#goldGrad)"/>
  <path d="M120,78 Q123,86 120,92 Q117,86 120,78 Z" fill="#ffffff"/>
