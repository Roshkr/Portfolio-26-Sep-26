    <textPath href="#jainBottomTextPath" startOffset="50%" text-anchor="middle">ARA, BIHAR • ESTD. 1942</textPath>
  </text>
  
  <path id="jainTopTextPath" d="M 32 120 A 88 88 0 0 1 208 120" fill="none"/>
  <path id="jainBottomTextPath" d="M 208 120 A 88 88 0 0 1 32 120" fill="none"/>
